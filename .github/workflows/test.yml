name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras pytest -v --color=yes
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: uv sync --locked --all-extras
      - run: uv run python tools/build_browser.py
      - run: npm ci --prefix tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test --prefix tests/browser
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: .cache/browser-failure.png
          if-no-files-found: ignore
